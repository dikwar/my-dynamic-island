<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<style>
  * {
    box-sizing: border-box;
    user-select: none;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }

  body {
    margin: 0;
    padding: 0;
    background: transparent;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    height: 100vh;
    overflow: hidden;
  }

  .island-wrapper {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: opacity 0.3s ease;
  }

  /* Mode Hantu (Ghost Mode - Tembus Klik & Transparan saat menghalangi aplikasi) */
  .island-wrapper.ghost-mode {
    opacity: 0.22 !important;
    pointer-events: none !important;
  }

  /* Aura Glow Berevolusi Sesuai Level Kultivasi */
  .glow {
    position: absolute;
    top: -6px;
    width: 245px;
    height: 36px;
    background: linear-gradient(90deg, #00f2fe, #4facfe, #38ef7d);
    background-size: 300% 300%;
    animation: gradientFlow 5s ease infinite;
    filter: blur(11px);
    opacity: 0.85;
    border-radius: 0 0 24px 24px;
    transition: all 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.1);
    z-index: 1;
  }

  @keyframes gradientFlow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* Kapsul Utama (Dibuat lebih ramping saat idle agar tidak menghalangi tab browser) */
  .notch {
    position: relative;
    z-index: 2;
    width: 240px;
    height: 32px;
    background: #0b0b0e;
    border-radius: 0 0 18px 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 4px 14px;
    transition: all 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.1);
    box-shadow: inset 0 -1px 2px rgba(255, 255, 255, 0.22), 0 6px 20px rgba(0,0,0,0.6);
    overflow: hidden;
    color: #fff;
  }

  .island-wrapper.speaking .notch {
    width: 310px;
    height: 58px;
  }
  .island-wrapper.speaking .glow {
    width: 320px;
    height: 64px;
  }

  /* Hanya melebar jika class .expanded aktif (Mencegah buka tak sengaja) */
  .island-wrapper.expanded .notch,
  .island-wrapper.pinned .notch {
    width: 450px;
    height: 320px;
    border-radius: 0 0 28px 28px;
    padding: 10px 16px;
  }

  .island-wrapper.expanded .glow,
  .island-wrapper.pinned .glow {
    width: 460px;
    height: 328px;
    filter: blur(16px);
    opacity: 0.95;
  }

  /* BARIS ATAS: Jam & RAM | Mata | Baterai */
  .top-bar {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 22px;
  }

  .mini-left, .mini-right {
    font-size: 10.5px;
    font-weight: 600;
    color: #bbb;
    min-width: 72px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .mini-right { justify-content: flex-end; color: #38ef7d; }

  /* Bar Kultivasi / Leveling */
  .cultivation-bar {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 10px;
    color: #ffe066;
    margin-top: 4px;
    opacity: 0;
    max-height: 0;
    transition: 0.25s;
  }
  .island-wrapper.expanded .cultivation-bar,
  .island-wrapper.pinned .cultivation-bar {
    opacity: 1;
    max-height: 20px;
  }
  .exp-track {
    flex: 1;
    height: 5px;
    background: rgba(255,255,255,0.12);
    border-radius: 4px;
    overflow: hidden;
  }
  .exp-fill {
    height: 100%;
    width: 20%;
    background: linear-gradient(90deg, #ffe066, #ff6b8b);
    transition: width 0.3s ease;
  }

  /* Speech Bubble */
  .speech-bubble {
    font-size: 11px;
    font-weight: 600;
    color: #ffe066;
    text-align: center;
    margin-top: 2px;
    opacity: 0;
    max-height: 0;
    transition: all 0.25s ease;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    width: 100%;
  }
  .island-wrapper.speaking .speech-bubble,
  .island-wrapper.expanded .speech-bubble,
  .island-wrapper.pinned .speech-bubble {
    opacity: 1;
    max-height: 22px;
  }

  /* MATA LUCU */
  .eyes-box {
    display: flex;
    gap: 15px;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s ease;
    cursor: pointer;
    padding: 2px 8px;
  }

  .eye {
    width: 14px;
    height: 9px;
    background: #ffe066;
    border-radius: 10px;
    box-shadow: 0 0 8px #ffd43b, 0 0 14px rgba(255, 212, 59, 0.7);
    transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
    animation: autoBlink 4.2s infinite;
  }

  .island-wrapper.expanded .eye,
  .island-wrapper.pinned .eye {
    width: 18px;
    height: 18px;
    border-radius: 50%;
  }

  .eye::after {
    content: '';
    position: absolute;
    width: 6px;
    height: 6px;
    background: #111;
    border-radius: 50%;
    top: 4px;
    left: 4px;
    opacity: 0;
  }
  .island-wrapper.expanded .eye::after,
  .island-wrapper.pinned .eye::after { opacity: 1; }

  /* Ekspresi Mata */
  .notch.happy .eye {
    height: 8px !important; width: 17px !important;
    background: transparent !important; box-shadow: none !important;
    border-top: 3.5px solid #ffe066; border-radius: 50% 50% 0 0 !important;
  }
  .notch.happy .eye::after { display: none; }
  .notch.wink .eye:first-child { height: 3px !important; width: 15px !important; border-radius: 4px !important; }
  .notch.wink .eye:first-child::after { display: none; }
  .notch.shock .eye { width: 19px !important; height: 19px !important; border-radius: 50% !important; background: #fff !important; box-shadow: 0 0 14px #fff !important; }
  .notch.sleepy .eye { height: 4px !important; width: 15px !important; background: #ff9f43 !important; border-radius: 3px !important; }
  .notch.sleepy .eye::after { display: none; }
  .notch.angry .eye:first-child { transform: rotate(22deg); background: #ff4757 !important; box-shadow: 0 0 10px #ff4757 !important; }
  .notch.angry .eye:last-child { transform: rotate(-22deg); background: #ff4757 !important; box-shadow: 0 0 10px #ff4757 !important; }
  .notch.cyber .eye { background: #00f2fe !important; box-shadow: 0 0 12px #00f2fe !important; }
  .notch.love .eye { background: #ff6b8b !important; box-shadow: 0 0 12px #ff6b8b !important; }

  @keyframes autoBlink {
    0%, 92%, 96%, 100% { transform: scaleY(1); }
    94% { transform: scaleY(0.1); }
  }

  /* AREA KONTEN */
  .content-area {
    width: 100%;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    display: flex;
    flex-direction: column;
    height: 100%;
    margin-top: 6px;
  }

  .island-wrapper.expanded .content-area,
  .island-wrapper.pinned .content-area {
    opacity: 1;
    pointer-events: auto;
  }

  .nav-tabs {
    display: flex;
    justify-content: space-between;
    background: rgba(255,255,255,0.07);
    padding: 3px;
    border-radius: 11px;
    margin-bottom: 7px;
  }

  .tab-btn {
    flex: 1;
    background: transparent;
    border: none;
    color: #aaa;
    padding: 4px 0;
    font-size: 10.5px;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s;
  }
  .tab-btn.active { background: rgba(255,255,255,0.18); color: #fff; }

  .tab-pane { display: none; flex-direction: column; flex: 1; overflow: hidden; }
  .tab-pane.active { display: flex; }

  /* 1. MUSIK & LO-FI NOISE */
  .music-box {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    flex: 1; gap: 6px; background: rgba(255,255,255,0.04); border-radius: 12px; padding: 8px;
  }
  .song-title {
    font-size: 11.5px; font-weight: 600; color: #ffe066;
    max-width: 340px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .music-controls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .btn-action {
    background: rgba(255,255,255,0.12); border: none; color: white;
    padding: 4px 9px; border-radius: 8px; font-size: 10.5px; cursor: pointer; transition: 0.2s;
  }
  .btn-action:hover { background: rgba(255,255,255,0.25); }
  .btn-primary { background: #4facfe; color: #000; font-weight: 600; }
  .btn-primary:hover { background: #00f2fe; }

  .visualizer { display: flex; gap: 3px; height: 15px; align-items: flex-end; }
  .bar { width: 4px; height: 4px; background: #00f2fe; border-radius: 2px; }
  .playing .bar { animation: bounce 0.5s infinite alternate; }
  .playing .bar:nth-child(2) { animation-delay: 0.2s; background: #a18cd1; }
  .playing .bar:nth-child(3) { animation-delay: 0.35s; background: #ff6b8b; }
  .playing .bar:nth-child(4) { animation-delay: 0.1s; background: #38ef7d; }
  @keyframes bounce { from { height: 4px; } to { height: 15px; } }

  /* 2. DROP FILE & CLIPBOARD */
  .drop-zone {
    flex: 1; border: 1.5px dashed rgba(255,255,255,0.25); border-radius: 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 6px; gap: 5px; overflow-y: auto;
  }
  .file-list { width: 100%; display: flex; flex-direction: column; gap: 4px; max-height: 115px; overflow-y: auto; }
  .file-item {
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(255,255,255,0.08); padding: 4px 9px; border-radius: 7px; font-size: 10.5px; cursor: pointer;
  }
  .file-item:hover { background: rgba(255,255,255,0.18); }

  /* 3. TIMER */
  .timer-box { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  .timer-display { font-size: 28px; font-weight: 700; letter-spacing: 2px; color: #38ef7d; }

  /* 4. WISHLIST */
  .wishlist-box { flex: 1; display: flex; flex-direction: column; gap: 5px; overflow: hidden; }
  .wish-input-row { display: flex; gap: 5px; }
  .wish-input {
    flex: 1; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
    color: white; padding: 4px 9px; border-radius: 7px; font-size: 10.5px; outline: none;
  }

  /* Footer Kontrol */
  .footer-bar {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 6px; padding-top: 5px; border-top: 1px solid rgba(255,255,255,0.08);
  }
  .active-toggle { background: rgba(255, 224, 102, 0.28) !important; color: #ffe066 !important; font-weight: 600; }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
</style>
</head>
<body>

  <div class="island-wrapper" id="island">
    <div class="glow" id="glowAura"></div>

    <div class="notch" id="notch">
      <!-- BARIS ATAS: Jam + RAM | Mata | Baterai -->
      <div class="top-bar">
        <div class="mini-left">
          <span id="clock">00:00</span>
          <span id="ramBadge" style="color:#00f2fe; font-size:9.5px;" title="Penggunaan RAM Laptop">🧠 --%</span>
        </div>

        <div class="eyes-box" id="eyesBox" title="Tahan kursor / Klik untuk membuka">
          <div class="eye"></div>
          <div class="eye"></div>
        </div>

        <div class="mini-right" id="batteryStatus">🔋 --%</div>
      </div>

      <!-- BAR LEVEL KULTIVASI (RPG) -->
      <div class="cultivation-bar">
        <span id="realmText">⚔️ Mortal Lv.1</span>
        <div class="exp-track"><div class="exp-fill" id="expFill"></div></div>
        <span id="expText">0/100 EXP</span>
      </div>

      <!-- TEKS BICARA NUSA -->
      <div class="speech-bubble" id="speechBubble">Halo Tuan! ✨</div>

      <!-- AREA KONTEN FITUR -->
      <div class="content-area">
        <div class="nav-tabs">
          <button class="tab-btn active" onclick="switchTab('music', this)">🎵 Audio</button>
          <button class="tab-btn" onclick="switchTab('files', this)">📂 File</button>
          <button class="tab-btn" onclick="switchTab('clip', this)">📋 Clipboard</button>
          <button class="tab-btn" onclick="switchTab('timer', this)">⏱️ Timer</button>
          <button class="tab-btn" onclick="switchTab('wish', this)">✨ Target</button>
        </div>

        <!-- 1. MUSIK & LO-FI GENERATOR -->
        <div class="tab-pane active" id="tab-music">
          <div class="music-box">
            <div class="visualizer" id="visualizer">
              <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            </div>
            <div class="song-title" id="songTitle">Pilih MP3 atau Suara Fokus Bawaan</div>
            <input type="file" id="audioInput" accept="audio/*" style="display:none">
            <audio id="audioPlayer"></audio>
            <div class="music-controls">
              <button class="btn-action" onclick="playSfx('click'); document.getElementById('audioInput').click()">📁 MP3</button>
              <button class="btn-action btn-primary" id="playPauseBtn" onclick="toggleMusic()">▶ Play</button>
              <button class="btn-action" id="rainBtn" onclick="toggleAmbient('rain')">🌧️ Hujan</button>
              <button class="btn-action" id="zenBtn" onclick="toggleAmbient('zen')">🌊 Deep Zen</button>
            </div>
          </div>
        </div>

        <!-- 2. DROP FILE -->
        <div class="tab-pane" id="tab-files">
          <div class="drop-zone" id="dropZone">
            <div id="dropHint" style="font-size:10.5px; color:#aaa; text-align:center;">
              📥 Drag & Drop file ke sini untuk disimpan sementara
            </div>
            <div class="file-list" id="fileList"></div>
          </div>
        </div>

        <!-- 3. SMART CLIPBOARD HISTORY -->
        <div class="tab-pane" id="tab-clip">
          <div class="drop-zone" style="border-style:solid; border-color:rgba(255,255,255,0.1);">
            <div style="font-size:10px; color:#ffe066;">📋 5 Teks Terakhir yang Kamu Copy (Klik untuk Copy ulang):</div>
            <div class="file-list" id="clipList"></div>
          </div>
        </div>

        <!-- 4. TIMER FOKUS (+EXP) -->
        <div class="tab-pane" id="tab-timer">
          <div class="timer-box">
            <div class="timer-display" id="timerDisplay">25:00</div>
            <div class="music-controls">
              <button class="btn-action btn-primary" id="timerStartBtn" onclick="toggleTimer()">Mulai (+50 EXP)</button>
              <button class="btn-action" onclick="setTimerMinutes(15)">15m</button>
              <button class="btn-action" onclick="setTimerMinutes(25)">25m</button>
              <button class="btn-action" onclick="resetTimer()">Reset</button>
            </div>
          </div>
        </div>

        <!-- 5. WISHLIST (+EXP) -->
        <div class="tab-pane" id="tab-wish">
          <div class="wishlist-box">
            <div class="wish-input-row">
              <input type="text" class="wish-input" id="wishInput" placeholder="Tulis targetmu lalu Enter (+25 EXP saat selesai)...">
              <button class="btn-action btn-primary" onclick="addWish()">+</button>
            </div>
            <div class="file-list" id="wishList"></div>
          </div>
        </div>

        <!-- FOOTER PENGATURAN & ANTI-PENGHALANG -->
        <div class="footer-bar">
          <div style="display:flex; gap:3px; align-items:center;">
            <button class="btn-action" id="voiceCmdBtn" onclick="startVoiceCommand()" title="Perintah Suara" style="padding:3px 6px; font-size:9.5px;">🎙️ Mic</button>
            <button class="btn-action" onclick="triggerGhost()" title="Mode Tembus Klik (Tekan Alt+X untuk kembali)" style="padding:3px 6px; font-size:9.5px;">👻 Ghost (Alt+X)</button>
            <button class="btn-action" onclick="cyclePosition()" title="Pindah Posisi Kiri/Tengah/Kanan" style="padding:3px 6px; font-size:9.5px;">↔️ Geser</button>
            <button class="btn-action active-toggle" id="sfxBtn" style="padding:3px 6px; font-size:9.5px;">🔊</button>
            <button class="btn-action" id="pinBtn" style="padding:3px 6px; font-size:9.5px;">📌 Pin</button>
          </div>
          <button class="btn-action" onclick="window.close()" style="padding:3px 6px; font-size:9.5px; background:rgba(255,80,80,0.3);">✕</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const island = document.getElementById('island');
    const notch = document.getElementById('notch');
    const eyesBox = document.getElementById('eyesBox');
    const speechBubble = document.getElementById('speechBubble');
    const batteryStatus = document.getElementById('batteryStatus');
    const ramBadge = document.getElementById('ramBadge');
    const glowAura = document.getElementById('glowAura');

    // --- 0. ANTI-PENGHALANG: HOVER DELAY, GHOST MODE & POSISI ---
    let hoverTimer = null;
    let isPinned = false;

    // Tidak langsung membuka kapsul kalau kursor hanya lewat (tunggu 380ms)
    island.addEventListener('mouseenter', () => {
      ipcRenderer.send('set-ignore-mouse', false);
      hoverTimer = setTimeout(() => {
        island.classList.add('expanded');
        playSfx('hover');
      }, 380);
    });

    island.addEventListener('mouseleave', () => {
      clearTimeout(hoverTimer);
      island.classList.remove('expanded');
      if (!isPinned) ipcRenderer.send('set-ignore-mouse', true);
      eyesBox.style.transform = `translate(0px, 0px)`;
    });

    // Ghost Mode (Alt + X) agar 100% tembus pandang & tembus klik
    function triggerGhost() {
      ipcRenderer.send('activate-ghost');
    }
    ipcRenderer.on('ghost-mode-changed', (e, isGhost) => {
      island.classList.toggle('ghost-mode', isGhost);
      island.classList.remove('expanded');
      if (!isGhost) nusaSpeak('Ghost Mode dimatikan, aku kembali Tuan! ✨', 'happy', false);
    });

    // Geser Posisi (Tengah -> Kanan -> Kiri) kalau tengah atas dipakai aplikasi lain
    const positions = ['center', 'right', 'left'];
    let posIndex = 0;
    function cyclePosition() {
      playSfx('click');
      posIndex = (posIndex + 1) % positions.length;
      ipcRenderer.send('move-position', positions[posIndex]);
    }

    // --- 1. SISTEM KULTIVASI / LEVELING RPG (NO. 2) ---
    let exp = parseInt(localStorage.getItem('nusa_exp') || '0');
    const realms = [
      { name: '⚔️ Mortal', aura: 'linear-gradient(90deg, #00f2fe, #4facfe, #38ef7d)' },
      { name: '🔥 Qi Refining', aura: 'linear-gradient(90deg, #f6d365, #fda085, #ff6b8b)' },
      { name: '⚡ Foundation', aura: 'linear-gradient(90deg, #a18cd1, #fbc2eb, #00f2fe)' },
      { name: '🌟 Golden Core', aura: 'linear-gradient(90deg, #ffd700, #ff8c00, #ff0080)' },
      { name: '🐉 Nascent Soul', aura: 'linear-gradient(90deg, #ff0844, #ffb199, #7f00ff)' },
      { name: '🌌 Divine Immortal', aura: 'linear-gradient(90deg, #00ffcc, #ff00ff, #ffff00)' }
    ];

    function updateCultivationUI() {
      const level = Math.floor(exp / 100) + 1;
      const currentExp = exp % 100;
      const realmIdx = Math.min(realms.length - 1, Math.floor((level - 1) / 2));
      document.getElementById('realmText').textContent = `${realms[realmIdx].name} Lv.${level}`;
      document.getElementById('expFill').style.width = `${currentExp}%`;
      document.getElementById('expText').textContent = `${currentExp}/100 EXP`;
      glowAura.style.background = realms[realmIdx].aura;
      glowAura.style.backgroundSize = '300% 300%';
    }

    function addExp(amount) {
      const oldLevel = Math.floor(exp / 100) + 1;
      exp += amount;
      localStorage.setItem('nusa_exp', exp);
      const newLevel = Math.floor(exp / 100) + 1;
      updateCultivationUI();
      if (newLevel > oldLevel) {
        nusaSpeak(`Terobosan Kultivasi! Aku naik ke Level ${newLevel} Tuan! ⚡`, 'cyber', true);
      }
    }
    updateCultivationUI();

    // --- 2. MONITOR KESEHATAN LAPTOP: RAM & CPU (NO. 3) ---
    let highRamWarned = false;
    ipcRenderer.on('system-stats', (e, stats) => {
      ramBadge.textContent = `🧠 ${stats.ram}%`;
      ramBadge.style.color = stats.ram > 85 ? '#ff4757' : '#00f2fe';
      if (stats.ram > 85 && !highRamWarned) {
        highRamWarned = true;
        nusaSpeak(`Waduh Tuan, RAM laptop kita sesak (${stats.ram}%)! Tutup aplikasi berat ya! 🥵`, 'angry', true);
      } else if (stats.ram <= 80) {
        highRamWarned = false;
      }
    });

    // --- 3. SMART CLIPBOARD HISTORY (NO. 4) ---
    let clipHistory = JSON.parse(localStorage.getItem('nusa_clips') || '[]');
    const clipList = document.getElementById('clipList');

    function renderClips() {
      localStorage.setItem('nusa_clips', JSON.stringify(clipHistory));
      clipList.innerHTML = '';
      if (clipHistory.length === 0) {
        clipList.innerHTML = '<div style="font-size:10px; color:#777; text-align:center;">Belum ada teks yang di-Copy</div>';
        return;
      }
      clipHistory.forEach((text, i) => {
        const div = document.createElement('div');
        div.className = 'file-item';
        div.innerHTML = `<span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:340px;">📎 ${text.replace(/</g, '&lt;')}</span><span style="color:#00f2fe; font-size:9px;">Salin</span>`;
        div.onclick = () => {
          playSfx('cute');
          ipcRenderer.send('copy-text', text);
          nusaSpeak('Teks berhasil di-Copy ulang Tuan! 📋', 'happy', false);
        };
        clipList.appendChild(div);
      });
    }
    renderClips();

    ipcRenderer.on('clipboard-update', (e, text) => {
      clipHistory = [text, ...clipHistory.filter(t => t !== text)].slice(0, 5);
      renderClips();
    });

    // --- 4. VOICE COMMAND / PERINTAH SUARA (NO. 5) ---
    function startVoiceCommand() {
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRec) {
        nusaSpeak('Maaf Tuan, modul mikrofon sedang sibuk.', 'sleepy', false);
        return;
      }
      const rec = new SpeechRec();
      rec.lang = 'id-ID';
      const btn = document.getElementById('voiceCmdBtn');
      btn.classList.add('active-toggle');
      nusaSpeak('Aku mendengarkan Tuan, silakan bicara... 🎙️', 'shock', false);

      rec.onresult = (event) => {
        const cmd = event.results[0][0].transcript.toLowerCase();
        btn.classList.remove('active-toggle');
        if (cmd.includes('timer') || cmd.includes('fokus')) {
          switchTab('timer', document.querySelectorAll('.tab-btn')[3]);
          toggleTimer();
        } else if (cmd.includes('hujan')) {
          switchTab('music', document.querySelectorAll('.tab-btn')[0]);
          toggleAmbient('rain');
        } else if (cmd.includes('musik') || cmd.includes('lagu')) {
          switchTab('music', document.querySelectorAll('.tab-btn')[0]);
          toggleMusic();
        } else if (cmd.includes('target') || cmd.includes('catatan')) {
          switchTab('wish', document.querySelectorAll('.tab-btn')[4]);
          nusaSpeak('Membuka daftar target Tuan! ✨', 'happy', true);
        } else {
          nusaSpeak(`Tuan bilang: "${cmd}" — Siap dilaksanakan! ✨`, 'happy', true);
        }
      };
      rec.onerror = () => btn.classList.remove('active-toggle');
      rec.start();
    }

    // --- 5. BUILT-IN LO-FI / WHITE NOISE GENERATOR (NO. 6) ---
    let ambientNode = null;
    let currentAmbient = null;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function toggleAmbient(type) {
      playSfx('click');
      if (audioCtx.state === 'suspended') audioCtx.resume();

      if (ambientNode) {
        ambientNode.stop();
        ambientNode.disconnect();
        ambientNode = null;
      }
      document.getElementById('rainBtn').classList.remove('active-toggle');
      document.getElementById('zenBtn').classList.remove('active-toggle');

      if (currentAmbient === type) {
        currentAmbient = null;
        document.getElementById('visualizer').classList.remove('playing');
        document.getElementById('songTitle').textContent = 'Suara fokus dihentikan';
        return;
      }

      currentAmbient = type;
      const bufferSize = 2 * audioCtx.sampleRate;
      const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      let lastOut = 0.0;
      for (let i = 0; i < bufferSize; i++) {
        const white = Math.random() * 2 - 1;
        output[i] = (lastOut + (0.02 * white)) / 1.02;
        lastOut = output[i];
        output[i] *= (type === 'rain' ? 1.8 : 0.9);
      }

      ambientNode = audioCtx.createBufferSource();
      ambientNode.buffer = noiseBuffer;
      ambientNode.loop = true;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = type === 'rain' ? 950 : 280;

      const gain = audioCtx.createGain();
      gain.gain.value = 0.25;

      ambientNode.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      ambientNode.start(0);

      document.getElementById(type === 'rain' ? 'rainBtn' : 'zenBtn').classList.add('active-toggle');
      document.getElementById('visualizer').classList.add('playing');
      document.getElementById('songTitle').textContent = type === 'rain' ? '🌧️ Memutar Suara Hujan Fokus...' : '🌊 Memutar Deep Zen Meditasi...';
      nusaSpeak(type === 'rain' ? 'Suara hujan dinyalakan, selamat fokus Tuan! 🌧️' : 'Mode tenang aktif Tuan! 🌊', 'happy', false);
    }

    // --- 6. EFEK SUARA & BICARA ---
    let soundEnabled = true;
    function playSfx(type) {
      if (!soundEnabled) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'click') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(950, now + 0.06);
        gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.06);
        osc.start(now); osc.stop(now + 0.06);
      } else if (type === 'cute') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(1100, now + 0.14);
        gain.gain.setValueAtTime(0.15, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
        osc.start(now); osc.stop(now + 0.2);
      } else if (type === 'hover') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(340, now);
        osc.frequency.exponentialRampToValueAtTime(480, now + 0.05);
        gain.gain.setValueAtTime(0.04, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
        osc.start(now); osc.stop(now + 0.05);
      } else if (type === 'angry') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(220, now);
        osc.frequency.linearRampToValueAtTime(130, now + 0.18);
        gain.gain.setValueAtTime(0.12, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.18);
        osc.start(now); osc.stop(now + 0.18);
      }
    }

    document.getElementById('sfxBtn').addEventListener('click', (e) => {
      soundEnabled = !soundEnabled;
      e.target.textContent = soundEnabled ? '🔊' : '🔇';
      e.target.classList.toggle('active-toggle', soundEnabled);
    });

    let speechTimeout;
    function nusaSpeak(text, expression = 'happy', useVoice = true) {
      speechBubble.textContent = text;
      island.classList.add('speaking');
      setExpression(expression, 3500);
      playSfx('cute');

      if (soundEnabled && useVoice && 'speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text.replace(/[^\w\s,!?.]/gi, ''));
        utter.lang = 'id-ID'; utter.pitch = 1.35; utter.rate = 1.05;
        window.speechSynthesis.speak(utter);
      }
      clearTimeout(speechTimeout);
      speechTimeout = setTimeout(() => island.classList.remove('speaking'), 4500);
    }

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const hour = new Date().getHours();
        let greet = 'Selamat malam Tuan! Mau ngoding atau santai? 🌙';
        if (hour >= 4 && hour < 11) greet = 'Selamat pagi Tuan! Sudah siap dengan hari ini? ☀️';
        else if (hour >= 11 && hour < 15) greet = 'Selamat siang Tuan! Tetap semangat ya! 🔥';
        else if (hour >= 15 && hour < 19) greet = 'Selamat sore Tuan! Jangan lupa istirahat ya ✨';
        nusaSpeak(greet, 'happy', true);
      }, 1000);
    });

    // --- 7. BATERAI & EKSPRESI MATA ---
    if ('getBattery' in navigator) {
      navigator.getBattery().then(battery => {
        function updateBattery() {
          const level = Math.round(battery.level * 100);
          const icon = battery.charging ? '⚡' : (level <= 20 ? '🪫' : '🔋');
          batteryStatus.textContent = `${icon} ${level}%`;
          batteryStatus.style.color = battery.charging ? '#00f2fe' : (level <= 20 ? '#ff4757' : '#38ef7d');
        }
        battery.addEventListener('chargingchange', () => {
          updateBattery();
          if (battery.charging) nusaSpeak('Asik! Charger dipasang, energi penuh! ⚡', 'cyber', true);
        });
        battery.addEventListener('levelchange', updateBattery);
        updateBattery();
      });
    }

    let currentMood = '';
    function setExpression(exp, duration = 0) {
      notch.className = 'notch ' + exp;
      if (duration > 0) setTimeout(() => { notch.className = 'notch ' + currentMood; }, duration);
    }

    let clickCount = 0, clickTimer;
    eyesBox.addEventListener('click', () => {
      island.classList.add('expanded');
      clickCount++;
      clearTimeout(clickTimer);
      if (clickCount >= 4) {
        playSfx('angry');
        nusaSpeak('Aduh Tuan, mataku pusing diklik terus! >_<', 'angry', true);
        clickCount = 0;
      } else {
        playSfx('cute');
        addExp(5);
        setExpression('happy', 1200);
        clickTimer = setTimeout(() => { clickCount = 0; }, 1000);
      }
    });

    document.addEventListener('mousemove', (e) => {
      const rect = notch.getBoundingClientRect();
      const dx = Math.max(-10, Math.min(10, (e.clientX - (rect.left + rect.width / 2)) / 12));
      const dy = Math.max(-5, Math.min(5, (e.clientY - (rect.top + rect.height / 2)) / 12));
      eyesBox.style.transform = `translate(${dx}px, ${dy}px)`;
    });

    document.getElementById('pinBtn').addEventListener('click', (e) => {
      playSfx('click');
      isPinned = !isPinned;
      island.classList.toggle('pinned', isPinned);
      e.target.classList.toggle('active-toggle', isPinned);
    });

    function switchTab(tabName, btn) {
      playSfx('click');
      document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('tab-' + tabName).classList.add('active');
      btn.classList.add('active');
    }

    // --- 8. MUSIK MP3, DROP FILE, TIMER & WISHLIST ---
    const audioInput = document.getElementById('audioInput');
    const audioPlayer = document.getElementById('audioPlayer');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const visualizer = document.getElementById('visualizer');

    audioInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        if (ambientNode) toggleAmbient(currentAmbient);
        document.getElementById('songTitle').textContent = file.name;
        audioPlayer.src = URL.createObjectURL(file);
        audioPlayer.play();
        playPauseBtn.textContent = '⏸ Pause';
        visualizer.classList.add('playing');
      }
    });

    function toggleMusic() {
      playSfx('click');
      if (!audioPlayer.src) { audioInput.click(); return; }
      if (audioPlayer.paused) { audioPlayer.play(); playPauseBtn.textContent = '⏸ Pause'; visualizer.classList.add('playing'); }
      else { audioPlayer.pause(); playPauseBtn.textContent = '▶ Play'; visualizer.classList.remove('playing'); }
    }

    // Drop File
    const dropZone = document.getElementById('dropZone');
    const fileList = document.getElementById('fileList');
    let droppedFiles = [];
    window.addEventListener('dragover', (e) => { e.preventDefault(); island.classList.add('expanded'); });
    window.addEventListener('drop', (e) => {
      e.preventDefault();
      Array.from(e.dataTransfer.files).forEach(f => droppedFiles.push({ name: f.name, path: f.path }));
      renderFiles();
      addExp(10);
      nusaSpeak('File berhasil disimpan Tuan! (+10 EXP) 📂', 'shock', false);
    });

    function renderFiles() {
      document.getElementById('dropHint').style.display = droppedFiles.length ? 'none' : 'block';
      fileList.innerHTML = '';
      droppedFiles.forEach((f, idx) => {
        const div = document.createElement('div');
        div.className = 'file-item';
        div.innerHTML = `<span onclick="openFile('${f.path.replace(/\\/g, '\\\\')}')">📄 ${f.name.substring(0, 28)}</span><span onclick="removeFile(${idx})" style="color:#ff6b8b;">✕</span>`;
        fileList.appendChild(div);
      });
    }
    window.openFile = (p) => ipcRenderer.send('open-file', p);
    window.removeFile = (i) => { droppedFiles.splice(i, 1); renderFiles(); };

    // Timer Fokus (+50 EXP)
    let timeLeft = 25 * 60, timerInterval = null;
    function updateTimerText() {
      const m = String(Math.floor(timeLeft / 60)).padStart(2, '0');
      const s = String(timeLeft % 60).padStart(2, '0');
      document.getElementById('timerDisplay').textContent = `${m}:${s}`;
    }
    function toggleTimer() {
      playSfx('click');
      const btn = document.getElementById('timerStartBtn');
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; btn.textContent = 'Mulai (+50 EXP)'; }
      else {
        btn.textContent = 'Jeda';
        timerInterval = setInterval(() => {
          if (timeLeft > 0) { timeLeft--; updateTimerText(); }
          else {
            clearInterval(timerInterval); timerInterval = null; btn.textContent = 'Mulai (+50 EXP)';
            addExp(50);
            nusaSpeak('Sesi fokus selesai! Tuan dapat +50 EXP Kultivasi! 🎉', 'happy', true);
          }
        }, 1000);
      }
    }
    function setTimerMinutes(m) { clearInterval(timerInterval); timerInterval = null; timeLeft = m * 60; updateTimerText(); }
    function resetTimer() { setTimerMinutes(25); }

    // Wishlist (+25 EXP)
    const wishInput = document.getElementById('wishInput');
    const wishListEl = document.getElementById('wishList');
    let wishes = JSON.parse(localStorage.getItem('my_wishes') || '[]');
    function renderWishes() {
      localStorage.setItem('my_wishes', JSON.stringify(wishes));
      wishListEl.innerHTML = '';
      wishes.forEach((w, idx) => {
        const item = document.createElement('div');
        item.className = 'file-item';
        item.innerHTML = `<span onclick="toggleWish(${idx})" style="${w.done ? 'text-decoration:line-through;color:#777;' : ''}">${w.done ? '✅' : '⬜'} ${w.text}</span><span onclick="deleteWish(${idx})" style="color:#ff6b8b;">✕</span>`;
        wishListEl.appendChild(item);
      });
    }
    function addWish() {
      const val = wishInput.value.trim();
      if (val) { wishes.push({ text: val, done: false }); wishInput.value = ''; renderWishes(); }
    }
    wishInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') addWish(); });
    window.toggleWish = (i) => {
      wishes[i].done = !wishes[i].done;
      if (wishes[i].done) { addExp(25); nusaSpeak('Target selesai! +25 EXP Kultivasi! ✨', 'happy', false); }
      renderWishes();
    };
    window.deleteWish = (i) => { wishes.splice(i, 1); renderWishes(); };
    renderWishes();

    setInterval(() => {
      const now = new Date();
      document.getElementById('clock').textContent = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    }, 1000);
  </script>
</body>
</html>
