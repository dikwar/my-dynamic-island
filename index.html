<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<style>
  * {
    box-sizing: border-box;
    user-select: none;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }

  body {
    margin: 0;
    padding: 0;
    background: transparent;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    height: 100vh;
    overflow: hidden;
  }

  .island-wrapper {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: opacity 0.3s ease;
  }

  .island-wrapper.ghost-mode {
    opacity: 0.2 !important;
    pointer-events: none !important;
  }

  /* Aura Glow */
  .glow {
    position: absolute;
    top: -6px;
    width: 250px;
    height: 38px;
    background: linear-gradient(90deg, #00f2fe, #4facfe, #38ef7d);
    background-size: 300% 300%;
    animation: gradientFlow 5s ease infinite;
    filter: blur(12px);
    opacity: 0.85;
    border-radius: 0 0 24px 24px;
    transition: all 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.1);
    z-index: 1;
  }

  @keyframes gradientFlow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* Kapsul Hitam Utama */
  .notch {
    position: relative;
    z-index: 2;
    width: 245px;
    height: 35px;
    background: #0b0b0e;
    border-radius: 0 0 19px 19px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 4px 14px;
    transition: all 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.1);
    box-shadow: inset 0 -1px 2px rgba(255, 255, 255, 0.22), 0 6px 20px rgba(0,0,0,0.6);
    overflow: hidden;
    color: #fff;
  }

  .island-wrapper.speaking .notch {
    width: 340px;
    height: 62px;
  }
  .island-wrapper.speaking .glow {
    width: 350px;
    height: 68px;
  }

  .island-wrapper.expanded .notch,
  .island-wrapper.pinned .notch {
    width: 470px;
    height: 355px;
    border-radius: 0 0 28px 28px;
    padding: 10px 16px;
  }

  .island-wrapper.expanded .glow,
  .island-wrapper.pinned .glow {
    width: 480px;
    height: 363px;
    filter: blur(16px);
    opacity: 0.95;
  }

  .top-bar {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 25px;
  }

  .mini-left, .mini-right {
    font-size: 10.5px;
    font-weight: 600;
    color: #bbb;
    min-width: 75px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .mini-right { justify-content: flex-end; color: #38ef7d; }

  /* WADAH WAJAH & MATA HIDUP (DENGAN PELACAK KURSOR MULUS) */
  .face-breath-wrapper {
    animation: floatBreath 3s ease-in-out infinite;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  @keyframes floatBreath {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-1.5px); }
  }

  .face-box {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    cursor: pointer;
    padding: 3px 10px;
    transition: transform 0.08s linear;
  }

  .eye-unit {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .brow {
    width: 12px;
    height: 2.5px;
    background: #ffe066;
    border-radius: 2px;
    margin-bottom: 2px;
    transition: all 0.25s ease;
    opacity: 0.85;
  }

  .eye {
    width: 16px;
    height: 11px;
    background: #ffe066;
    border-radius: 10px;
    box-shadow: 0 0 8px #ffd43b, 0 0 14px rgba(255, 212, 59, 0.75);
    transition: width 0.22s, height 0.22s, border-radius 0.22s, background 0.22s;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: autoBlink 4s infinite;
  }

  /* Kilau Mata */
  .eye::before {
    content: '';
    position: absolute;
    width: 3.5px;
    height: 3.5px;
    background: #fff;
    border-radius: 50%;
    top: 1.5px;
    right: 2px;
    z-index: 3;
  }

  /* Pupil Hitam yang Bergerak Mengikuti Kursor Mouse */
  .pupil {
    width: 6px;
    height: 6px;
    background: #111;
    border-radius: 50%;
    position: relative;
    z-index: 2;
    transition: transform 0.06s linear;
  }

  .island-wrapper.expanded .eye,
  .island-wrapper.pinned .eye {
    width: 20px;
    height: 20px;
    border-radius: 50%;
  }
  .island-wrapper.expanded .pupil,
  .island-wrapper.pinned .pupil {
    width: 7.5px;
    height: 7.5px;
  }

  .blush {
    position: absolute;
    bottom: -2px;
    width: 9px;
    height: 4px;
    background: #ff6b8b;
    border-radius: 50%;
    filter: blur(1.5px);
    opacity: 0.4;
    transition: 0.3s;
  }
  .blush.left { left: -2px; }
  .blush.right { right: -2px; }

  /* RAGAM EKSPRESI HIDUP */
  .notch.happy .eye {
    height: 9px !important; width: 17px !important;
    background: transparent !important; box-shadow: none !important;
    border-top: 3.5px solid #ffe066; border-radius: 50% 50% 0 0 !important;
  }
  .notch.happy .pupil, .notch.happy .eye::before { display: none; }
  .notch.happy .brow { transform: translateY(-2px); }
  .notch.happy .blush { opacity: 0.95; transform: scale(1.2); }

  .notch.wink .eye-unit:first-child .eye { height: 3px !important; width: 16px !important; border-radius: 4px !important; }
  .notch.wink .eye-unit:first-child .pupil { display: none; }
  .notch.wink .blush { opacity: 0.85; }

  .notch.shock .eye { width: 20px !important; height: 20px !important; border-radius: 50% !important; background: #fff !important; box-shadow: 0 0 15px #fff !important; }
  .notch.shock .brow { transform: translateY(-4px) scaleX(1.2); }

  .notch.angry .eye-unit:first-child .brow { transform: rotate(25deg) translateY(2px); background: #ff4757; }
  .notch.angry .eye-unit:last-child .brow { transform: rotate(-25deg) translateY(2px); background: #ff4757; }
  .notch.angry .eye { background: #ff4757 !important; box-shadow: 0 0 12px #ff4757 !important; height: 9px !important; }

  .notch.cyber .eye, .notch.cyber .brow { background: #00f2fe !important; box-shadow: 0 0 12px #00f2fe !important; }
  .notch.love .eye, .notch.love .brow { background: #ff6b8b !important; box-shadow: 0 0 12px #ff6b8b !important; }
  .notch.love .blush { opacity: 1; transform: scale(1.4); }
  .notch.sleepy .eye { height: 3.5px !important; width: 15px !important; background: #ff9f43 !important; }
  .notch.sleepy .pupil { display: none; }
  .notch.sleepy .brow { transform: translateY(2px); opacity: 0.4; }

  @keyframes autoBlink {
    0%, 92%, 96%, 100% { transform: scaleY(1); }
    94% { transform: scaleY(0.1); }
  }

  .cultivation-bar {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 10px;
    color: #ffe066;
    margin-top: 3px;
    opacity: 0;
    max-height: 0;
    transition: 0.25s;
  }
  .island-wrapper.expanded .cultivation-bar,
  .island-wrapper.pinned .cultivation-bar {
    opacity: 1;
    max-height: 20px;
  }
  .exp-track {
    flex: 1; height: 5px; background: rgba(255,255,255,0.12); border-radius: 4px; overflow: hidden;
  }
  .exp-fill {
    height: 100%; width: 20%; background: linear-gradient(90deg, #ffe066, #ff6b8b); transition: width 0.3s ease;
  }

  .speech-bubble {
    font-size: 11px;
    font-weight: 600;
    color: #ffe066;
    text-align: center;
    margin-top: 2px;
    opacity: 0;
    max-height: 0;
    transition: all 0.25s ease;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    width: 100%;
  }
  .island-wrapper.speaking .speech-bubble,
  .island-wrapper.expanded .speech-bubble,
  .island-wrapper.pinned .speech-bubble {
    opacity: 1;
    max-height: 22px;
  }

  .content-area {
    width: 100%;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    display: flex;
    flex-direction: column;
    height: 100%;
    margin-top: 5px;
  }

  .island-wrapper.expanded .content-area,
  .island-wrapper.pinned .content-area {
    opacity: 1;
    pointer-events: auto;
  }

  .nav-tabs {
    display: flex;
    justify-content: space-between;
    background: rgba(255,255,255,0.07);
    padding: 3px;
    border-radius: 10px;
    margin-bottom: 6px;
    gap: 2px;
  }

  .tab-btn {
    flex: 1;
    background: transparent;
    border: none;
    color: #aaa;
    padding: 4px 0;
    font-size: 10px;
    font-weight: 600;
    border-radius: 7px;
    cursor: pointer;
    transition: 0.2s;
  }
  .tab-btn.active { background: rgba(255,255,255,0.18); color: #fff; }

  .tab-pane { display: none; flex-direction: column; flex: 1; overflow: hidden; }
  .tab-pane.active { display: flex; }

  .music-box {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    flex: 1; gap: 6px; background: rgba(255,255,255,0.04); border-radius: 12px; padding: 8px;
  }
  .song-title {
    font-size: 11px; font-weight: 600; color: #1ed760;
    max-width: 380px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .music-controls { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .btn-action {
    background: rgba(255,255,255,0.12); border: none; color: white;
    padding: 4px 8px; border-radius: 7px; font-size: 10px; cursor: pointer; transition: 0.2s;
  }
  .btn-action:hover { background: rgba(255,255,255,0.25); }
  .btn-primary { background: #4facfe; color: #000; font-weight: 600; }
  .btn-primary:hover { background: #00f2fe; }
  .btn-spotify { background: #1db954; color: #000; font-weight: 700; }
  .btn-spotify:hover { background: #1ed760; }

  .visualizer { display: flex; gap: 3px; height: 14px; align-items: flex-end; }
  .bar { width: 4px; height: 4px; background: #1ed760; border-radius: 2px; }
  .playing .bar { animation: bounce 0.5s infinite alternate; }
  .playing .bar:nth-child(2) { animation-delay: 0.2s; background: #00f2fe; }
  .playing .bar:nth-child(3) { animation-delay: 0.35s; background: #ff6b8b; }
  .playing .bar:nth-child(4) { animation-delay: 0.1s; background: #ffe066; }
  @keyframes bounce { from { height: 4px; } to { height: 14px; } }

  .drop-zone {
    flex: 1; border: 1.5px dashed rgba(255,255,255,0.2); border-radius: 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding: 6px; gap: 4px; overflow-y: auto;
  }
  .file-list { width: 100%; display: flex; flex-direction: column; gap: 4px; max-height: 125px; overflow-y: auto; }
  .file-item {
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(255,255,255,0.07); padding: 5px 9px; border-radius: 7px; font-size: 10.5px; cursor: pointer;
  }
  .file-item:hover { background: rgba(255,255,255,0.16); }

  .code-editor {
    width: 100%;
    height: 72px;
    background: #050507;
    color: #38ef7d;
    border: 1px solid rgba(0, 242, 254, 0.3);
    border-radius: 8px;
    padding: 6px;
    font-family: 'Consolas', monospace;
    font-size: 10.5px;
    resize: none;
    outline: none;
    user-select: text;
  }

  .timer-box { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  .timer-display { font-size: 26px; font-weight: 700; letter-spacing: 2px; color: #38ef7d; }

  .wish-input {
    flex: 1; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
    color: white; padding: 4px 9px; border-radius: 7px; font-size: 10.5px; outline: none; user-select: text;
  }

  .footer-bar {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 6px; padding-top: 5px; border-top: 1px solid rgba(255,255,255,0.08);
  }
  .active-toggle { background: rgba(255, 224, 102, 0.28) !important; color: #ffe066 !important; font-weight: 600; }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
</style>
<style id="selfCustomStyle"></style>
</head>
<body>

  <div class="island-wrapper" id="island">
    <div class="glow" id="glowAura"></div>

    <div class="notch" id="notch">
      <!-- BARIS ATAS: Jam + RAM | Wajah & Mata Melirik Kursor | Baterai -->
      <div class="top-bar">
        <div class="mini-left">
          <span id="clock">00:00</span>
          <span id="ramBadge" style="color:#00f2fe; font-size:9.5px;">🧠 --%</span>
        </div>

        <div class="face-breath-wrapper">
          <div class="face-box" id="eyesBox" title="Klik untuk elus / ngobrol!">
            <div class="blush left"></div>
            <div class="eye-unit">
              <div class="brow"></div>
              <div class="eye"><div class="pupil"></div></div>
            </div>
            <div class="eye-unit">
              <div class="brow"></div>
              <div class="eye"><div class="pupil"></div></div>
            </div>
            <div class="blush right"></div>
          </div>
        </div>

        <div class="mini-right" id="batteryStatus">🔋 --%</div>
      </div>

      <!-- BAR LEVEL KULTIVASI -->
      <div class="cultivation-bar">
        <span id="realmText">⚔️ Mortal Lv.1</span>
        <div class="exp-track"><div class="exp-fill" id="expFill"></div></div>
        <span id="expText">0/100 EXP</span>
      </div>

      <!-- GELEMBUNG BICARA NUSA -->
      <div class="speech-bubble" id="speechBubble">Halo Tuan! ✨</div>

      <!-- MENU UTAMA -->
      <div class="content-area">
        <div class="nav-tabs">
          <button class="tab-btn active" onclick="switchTab('music', this)">🟢 Spotify/Audio</button>
          <button class="tab-btn" onclick="switchTab('quests', this)">⚔️ Misi</button>
          <button class="tab-btn" onclick="switchTab('selfcode', this)">🧬 Ngoding</button>
          <button class="tab-btn" onclick="switchTab('files', this)">📂 File/Clip</button>
          <button class="tab-btn" onclick="switchTab('timer', this)">⏱️ Timer</button>
          <button class="tab-btn" onclick="switchTab('wish', this)">✨ Target</button>
        </div>

        <!-- 1. TAB SPOTIFY, MP3 & LO-FI -->
        <div class="tab-pane active" id="tab-music">
          <div class="music-box">
            <div class="visualizer" id="visualizer">
              <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            </div>
            <div class="song-title" id="songTitle">🟢 Putar lagu di aplikasi Spotify atau pilih MP3</div>

            <div class="music-controls">
              <button class="btn-action btn-spotify" onclick="spotifyCmd('open')">🟢 Buka Spotify</button>
              <button class="btn-action" onclick="spotifyCmd('prev')">⏮️</button>
              <button class="btn-action btn-spotify" onclick="spotifyCmd('playpause')">⏯️ Play/Pause</button>
              <button class="btn-action" onclick="spotifyCmd('next')">⏭️</button>
            </div>

            <input type="file" id="audioInput" accept="*" style="display:none">
            <audio id="audioPlayer"></audio>
            <div class="music-controls" style="margin-top:2px; padding-top:4px; border-top:1px solid rgba(255,255,255,0.08); width:100%;">
              <button class="btn-action" onclick="playSfx('click'); document.getElementById('audioInput').click()">📁 File MP3</button>
              <button class="btn-action" id="playPauseBtn" onclick="toggleMusic()">▶ MP3</button>
              <button class="btn-action" id="rainBtn" onclick="toggleAmbient('rain')">🌧️ Hujan</button>
              <button class="btn-action" id="zenBtn" onclick="toggleAmbient('zen')">🌊 Deep Zen</button>
            </div>
          </div>
        </div>

        <!-- 2. TAB MISI KULTIVASI OTOMATIS -->
        <div class="tab-pane" id="tab-quests">
          <div class="drop-zone" style="border-style:solid; border-color:rgba(255,224,102,0.2);">
            <div style="font-size:10px; color:#ffe066; width:100%; display:flex; justify-content:space-between;">
              <span>📜 Misi Kultivasi Harian (Otomatis Terdeteksi):</span>
              <span onclick="resetDailyQuests()" style="cursor:pointer; color:#00f2fe;">🔄 Reset Harian</span>
            </div>
            <div class="file-list" id="questList"></div>
          </div>
        </div>

        <!-- 3. TAB SELF-CODING -->
        <div class="tab-pane" id="tab-selfcode">
          <div class="music-box" style="align-items:stretch; gap:5px;">
            <div style="font-size:10px; color:#00f2fe; display:flex; justify-content:space-between;">
              <span>🧬 Modifikasi DNA / Kode Tubuh Nusa (CSS Live):</span>
              <span style="color:#aaa;">Otomatis Tersimpan</span>
            </div>
            <textarea class="code-editor" id="selfCodeInput" placeholder="/* Ketik CSS untuk mengubah mata/tubuh Nusa, atau pilih Preset di bawah */"></textarea>
            <div class="music-controls" style="justify-content:space-between;">
              <div style="display:flex; gap:4px;">
                <button class="btn-action" onclick="applyPreset('sharingan')">👁️ Sharingan</button>
                <button class="btn-action" onclick="applyPreset('cat')">🐱 Mata Kucing</button>
                <button class="btn-action" onclick="applyPreset('matrix')">👾 Matrix</button>
                <button class="btn-action" onclick="applyPreset('gold')">👑 Emas</button>
              </div>
              <div style="display:flex; gap:4px;">
                <button class="btn-action" onclick="applySelfCode(true)" style="background:#38ef7d; color:#000; font-weight:bold;">⚡ Terapkan</button>
                <button class="btn-action" onclick="applyPreset('reset')">Reset</button>
              </div>
            </div>
          </div>
        </div>

        <!-- 4. TAB DROP FILE & CLIPBOARD -->
        <div class="tab-pane" id="tab-files">
          <div class="drop-zone" id="dropZone">
            <div style="display:flex; gap:6px; width:100%; margin-bottom:2px;">
              <button class="btn-action active-toggle" id="subFileBtn" onclick="toggleFileClip('files')" style="flex:1;">📂 Drop File Shelf</button>
              <button class="btn-action" id="subClipBtn" onclick="toggleFileClip('clips')" style="flex:1;">📋 Riwayat Copy (Clipboard)</button>
            </div>
            <div id="dropHint" style="font-size:10px; color:#aaa; text-align:center;">
              📥 Drag & Drop file apa saja ke sini untuk disimpan sementara
            </div>
            <div class="file-list" id="fileList"></div>
            <div class="file-list" id="clipList" style="display:none;"></div>
          </div>
        </div>

        <!-- 5. TAB TIMER -->
        <div class="tab-pane" id="tab-timer">
          <div class="timer-box">
            <div class="timer-display" id="timerDisplay">25:00</div>
            <div class="music-controls">
              <button class="btn-action btn-primary" id="timerStartBtn" onclick="toggleTimer()">Mulai (+50 EXP)</button>
              <button class="btn-action" onclick="setTimerMinutes(15)">15m</button>
              <button class="btn-action" onclick="setTimerMinutes(25)">25m</button>
              <button class="btn-action" onclick="resetTimer()">Reset</button>
            </div>
          </div>
        </div>

        <!-- 6. TAB TARGET / WISHLIST -->
        <div class="tab-pane" id="tab-wish">
          <div class="drop-zone" style="border:none; padding:0;">
            <div style="display:flex; gap:5px; width:100%;">
              <input type="text" class="wish-input" id="wishInput" placeholder="Tulis targetmu lalu Enter (+25 EXP)...">
              <button class="btn-action btn-primary" onclick="addWish()">+</button>
            </div>
            <div class="file-list" id="wishList"></div>
          </div>
        </div>

        <!-- FOOTER LENGKAP -->
        <div class="footer-bar">
          <div style="display:flex; gap:3px; align-items:center; flex-wrap:wrap;">
            <button class="btn-action" id="moodBtn" style="padding:3px 6px; font-size:9.5px;">😊 Mood</button>
            <button class="btn-action" onclick="randomTalk()" style="padding:3px 6px; font-size:9.5px;">🗣️ Sapa</button>
            <button class="btn-action" id="voiceCmdBtn" onclick="startVoiceCommand()" style="padding:3px 6px; font-size:9.5px;">🎙️ Mic</button>
            <button class="btn-action" id="autoStartBtn" style="padding:3px 6px; font-size:9.5px;">⚡ AutoStart</button>
            <button class="btn-action" onclick="triggerGhost()" style="padding:3px 6px; font-size:9.5px;">👻 Ghost</button>
            <button class="btn-action" onclick="cyclePosition()" style="padding:3px 6px; font-size:9.5px;">↔️</button>
            <button class="btn-action active-toggle" id="sfxBtn" style="padding:3px 6px; font-size:9.5px;">🔊</button>
            <button class="btn-action" id="pinBtn" style="padding:3px 6px; font-size:9.5px;">📌</button>
          </div>
          <button class="btn-action" onclick="window.close()" style="padding:3px 6px; font-size:9.5px; background:rgba(255,80,80,0.3);">✕</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const island = document.getElementById('island');
    const notch = document.getElementById('notch');
    const eyesBox = document.getElementById('eyesBox');
    const pupils = document.querySelectorAll('.pupil');
    const speechBubble = document.getElementById('speechBubble');
    const batteryStatus = document.getElementById('batteryStatus');
    const ramBadge = document.getElementById('ramBadge');
    const glowAura = document.getElementById('glowAura');
    const songTitleEl = document.getElementById('songTitle');
    const visualizer = document.getElementById('visualizer');

    // --- 0. PELACAK MATA & PUPIL MENGIKUTI KURSOR DI SELURUH LAYAR ---
    ipcRenderer.on('global-cursor', (e, pos) => {
      const diffX = pos.cursorX - pos.centerX;
      const diffY = pos.cursorY - pos.centerY;

      // Gerakan seluruh wadah wajah/mata
      const faceX = Math.max(-9, Math.min(9, (diffX / (pos.screenW / 2)) * 9));
      const faceY = Math.max(-3.5, Math.min(4.5, (diffY / pos.screenH) * 5));
      eyesBox.style.transform = `translate(${faceX}px, ${faceY}px)`;

      // Gerakan pupil hitam di dalam bola mata
      const pupilX = Math.max(-3.8, Math.min(3.8, (diffX / (pos.screenW / 2)) * 4.2));
      const pupilY = Math.max(-2.2, Math.min(2.8, (diffY / pos.screenH) * 3));
      pupils.forEach(p => {
        p.style.transform = `translate(${pupilX}px, ${pupilY}px)`;
      });
    });

    let soundEnabled = true;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSfx(type) {
      if (!soundEnabled) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'click') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(620, now);
        osc.frequency.exponentialRampToValueAtTime(980, now + 0.06);
        gain.gain.setValueAtTime(0.12, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.06);
        osc.start(now); osc.stop(now + 0.06);
      } else if (type === 'cute') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(1150, now + 0.14);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.24);
        gain.gain.setValueAtTime(0.18, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.24);
        osc.start(now); osc.stop(now + 0.24);
      } else if (type === 'hover') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(340, now);
        osc.frequency.exponentialRampToValueAtTime(480, now + 0.05);
        gain.gain.setValueAtTime(0.05, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
        osc.start(now); osc.stop(now + 0.05);
      } else if (type === 'angry') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(220, now);
        osc.frequency.linearRampToValueAtTime(130, now + 0.2);
        gain.gain.setValueAtTime(0.14, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
        osc.start(now); osc.stop(now + 0.2);
      }
    }

    let ambientNode = null, currentAmbient = null;
    function toggleAmbient(type) {
      playSfx('click');
      if (audioCtx.state === 'suspended') audioCtx.resume();
      if (ambientNode) { ambientNode.stop(); ambientNode.disconnect(); ambientNode = null; }
      document.getElementById('rainBtn').classList.remove('active-toggle');
      document.getElementById('zenBtn').classList.remove('active-toggle');

      if (currentAmbient === type) {
        currentAmbient = null;
        visualizer.classList.remove('playing');
        songTitleEl.textContent = 'Suara fokus dihentikan';
        return;
      }
      currentAmbient = type;
      const bufferSize = 2 * audioCtx.sampleRate;
      const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      let lastOut = 0.0;
      for (let i = 0; i < bufferSize; i++) {
        const white = Math.random() * 2 - 1;
        output[i] = (lastOut + (0.02 * white)) / 1.02;
        lastOut = output[i];
        output[i] *= (type === 'rain' ? 1.8 : 0.9);
      }
      ambientNode = audioCtx.createBufferSource();
      ambientNode.buffer = noiseBuffer; ambientNode.loop = true;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass'; filter.frequency.value = type === 'rain' ? 950 : 280;
      const gain = audioCtx.createGain(); gain.gain.value = 0.25;
      ambientNode.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
      ambientNode.start(0);

      document.getElementById(type === 'rain' ? 'rainBtn' : 'zenBtn').classList.add('active-toggle');
      visualizer.classList.add('playing');
      songTitleEl.textContent = type === 'rain' ? '🌧️ Memutar Suara Hujan Fokus...' : '🌊 Memutar Deep Zen Meditasi...';
    }

    function toggleTimer() {
      playSfx('click');
      const btn = document.getElementById('timerStartBtn');
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; btn.textContent = 'Mulai (+50 EXP)'; }
      else {
        btn.textContent = 'Jeda';
        timerInterval = setInterval(() => {
          if (timeLeft > 0) { timeLeft--; updateTimerText(); }
          else {
            clearInterval(timerInterval); timerInterval = null; btn.textContent = 'Mulai (+50 EXP)';
            completeQuestById('timer', 'Sesi Timer Fokus selesai! Tuan dapat +50 EXP! 🎉');
          }
        }, 1000);
      }
    }
    function setTimerMinutes(m) { clearInterval(timerInterval); timerInterval = null; timeLeft = m * 60; updateTimerText(); }
    function resetTimer() { setTimerMinutes(25); }

    const wishInput = document.getElementById('wishInput');
    const wishListEl = document.getElementById('wishList');
    let wishes = JSON.parse(localStorage.getItem('my_wishes') || '[]');
    function renderWishes() {
      localStorage.setItem('my_wishes', JSON.stringify(wishes));
      wishListEl.innerHTML = '';
      wishes.forEach((w, idx) => {
        const item = document.createElement('div');
        item.className = 'file-item';
        item.innerHTML = `<span onclick="toggleWish(${idx})" style="${w.done ? 'text-decoration:line-through;color:#777;' : ''}">${w.done ? '✅' : '⬜'} ${w.text}</span><span onclick="deleteWish(${idx})" style="color:#ff6b8b;">✕</span>`;
        wishListEl.appendChild(item);
      });
    }
    function addWish() {
      const val = wishInput.value.trim();
      if (val) { wishes.push({ text: val, done: false }); wishInput.value = ''; renderWishes(); }
    }
    wishInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') addWish(); });
    window.toggleWish = (i) => {
      wishes[i].done = !wishes[i].done;
      if (wishes[i].done) { addExp(25); nusaSpeak('Target selesai! +25 EXP Kultivasi! ✨', 'happy', false); }
      renderWishes();
    };
    window.deleteWish = (i) => { wishes.splice(i, 1); renderWishes(); };
    renderWishes();

    function startVoiceCommand() {
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRec) { nusaSpeak('Modul mikrofon belum tersedia Tuan.', 'sleepy', false); return; }
      const rec = new SpeechRec(); rec.lang = 'id-ID';
      document.getElementById('voiceCmdBtn').classList.add('active-toggle');
      nusaSpeak('Silakan bicara Tuan... 🎙️', 'shock', false);
      rec.onresult = (ev) => {
        const cmd = ev.results[0][0].transcript.toLowerCase();
        document.getElementById('voiceCmdBtn').classList.remove('active-toggle');
        if (cmd.includes('spotify')) spotifyCmd('open');
        else if (cmd.includes('lanjut') || cmd.includes('next')) spotifyCmd('next');
        else if (cmd.includes('sharingan')) applyPreset('sharingan');
        else if (cmd.includes('kucing')) applyPreset('cat');
        else if (cmd.includes('hujan')) toggleAmbient('rain');
        else nusaSpeak(`Tuan bilang: "${cmd}" — Siap! ✨`, 'happy', true);
      };
      rec.onerror = () => document.getElementById('voiceCmdBtn').classList.remove('active-toggle');
      rec.start();
    }

    setInterval(() => {
      const now = new Date();
      document.getElementById('clock').textContent = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    }, 1000);
  </script>
</body>
</html>
